<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQX — الإدارة العامة</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .logo-box {
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 3.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .brand-desc {
            font-size: 0.95rem;
            color: var(--gold-primary);
            margin-bottom: 2rem;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 1.5rem 0;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-box">
                <div class="logo">AQX</div>
            </div>
            <h1 class="brand-name">القرمانى اكس</h1>
            <p class="brand-desc">الإدارة العامة — General Administration</p>
            
            <div class="divider"></div>

            <div class="status-badge">
                <span class="status-dot"></span>
                محرك التحكم والادارة نشط وآمن
            </div>

            <div class="footer-note">
                &copy; 2026 Alqurmani X Core Engine. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>
