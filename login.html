<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول الآمن | AQX General Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .brand-header { text-align: center; margin-bottom: 30px; }
    .brand-header i { font-size: 40px; color: var(--primary); margin-bottom: 12px; }
    .brand-header h1 { font-size: 22px; font-weight: 800; }
    .brand-header p { color: var(--text-muted); font-size: 13px; margin-top: 5px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i { position: absolute; right: 16px; color: var(--text-muted); }
    
    .input-wrapper input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    .input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

    .options-row { display: flex; justify-content: flex-end; margin-bottom: 20px; font-size: 13px; }
    .forgot-link { color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 500; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--error-color); }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success-color); }

    .loader {
      width: 18px; height: 18px; border: 2px solid #fff; border-bottom-color: transparent;
      border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite;
    }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <i class="fa-solid fa-shield-halved"></i>
      <h1>AQX General Admin</h1>
      <p>تسجيل الدخول الآمن (بدون تفعيل)</p>
    </div>

    <div id="alertBox" class="alert">
      <i id="alertIcon" class="fa-solid"></i>
      <span id="alertMessage"></span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني للإدارة</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" placeholder="alqurmanix@gmail.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="options-row">
        <a id="forgotPasswordBtn" class="forgot-link">نسيت كلمة السر؟</a>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">دخول آمن</span>
        <span id="btnLoader" class="loader" style="display: none;"></span>
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDnd0vqF_YzIhSL8bRPa4WF921HLVtNPM",
      authDomain: "aqx-general-admin-core.firebaseapp.com",
      projectId: "aqx-general-admin-core",
      storageBucket: "aqx-general-admin-core.firebasestorage.app",
      messagingSenderId: "382292435821",
      appId: "1:382292435821:web:a07be2da91cec07659b064",
      measurementId: "G-0RZLCBDD4F"
    };

    const ENGINE_URL = "https://script.google.com/macros/s/AKfycbzWkGGg6tgJpYbn_bd_wjcDJ956_X3XhLgE07mM_rF7-ysLCYFsSvmYzDgrkQcNo0xg_w/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnLoader = document.getElementById("btnLoader");
    const alertBox = document.getElementById("alertBox");
    const alertMessage = document.getElementById("alertMessage");
    const alertIcon = document.getElementById("alertIcon");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");

    function showAlert(msg, type = "error") {
      alertBox.className = `alert alert-${type}`;
      alertIcon.className = type === "error" ? "fa-solid fa-circle-exclamation" : "fa-solid fa-circle-check";
      alertMessage.textContent = msg;
      alertBox.style.display = "flex";
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.style.display = isLoading ? "none" : "inline";
      btnLoader.style.display = isLoading ? "inline-block" : "none";
    }

    // تسجيل الدخول بدون شرط تفعيل الإيميل (مع الأمان الكامل)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      setLoading(true);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // تسجيل الدخول مباشرة عبر Firebase Auth
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        
        // الأمان هنا: التأكد أن الإيميل المطابق هو إيميلك الإداري المصرح به فقط
        if (email !== "alqurmanix@gmail.com") {
          showAlert("هذا الحساب غير مصرح له بالدخول كمدير للنظام.");
          setLoading(false);
          return;
        }

        showAlert("تم الدخول بنجاح! جاري التوجيه...", "success");
        
        // إرسال إشعار للمحرك (Google Apps Script) بتسجيل الدخول
        fetch(`${ENGINE_URL}?collection=admin_accounts&id=AQX-ADMIN-001`).catch(() => {});

        setTimeout(() => {
          window.location.href = "dashboard.html"; // ملف لوحة التحكم أو الصفحة التالية
        }, 1200);

      } catch (error) {
        setLoading(false);
        showAlert("خطأ في البريد الإلكتروني أو كلمة المرور.");
      }
    });

    // استعادة كلمة المرور
    forgotPasswordBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showAlert("اكتب بريدك الإلكتروني في الحانة أولاً لاستعادة كلمة المرور.");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showAlert("تم إرسال رابط استعادة كلمة المرور إلى بريدك بنجاح.", "success");
      } catch (e) {
        showAlert("فشل إرسال رابط الاستعادة. تأكد من البريد.");
      }
    });
  </script>
</body>
</html>
